<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>ast-visualizer</title>
    <style>
      body {
        display: flex;
      }
      .panel {
        flex: 1;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="editor">
      <textarea id="file-contents" placeholder="Write your .lox file here..."></textarea>
    </div>

    <div class="panel" id="terminal">
      <div>
        <input id="command-input" type="text" placeholder="run donut.lox" />
        <button id="submit-button">Run</button>
      </div>
      <div id="output-space"></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
